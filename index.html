<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor y Motor de Niveles Puzzle 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    #controls { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; width: 100%; max-width: 800px; }
    select, button { padding: 8px 12px; border-radius: 4px; border: none; background: #3a3a3a; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover, select:hover { background: #4a4a4a; }
    #game-container { position: relative; width: 800px; height: 500px; background: #111; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    canvas { background: #000; border-radius: 4px; }
    #info-panel { margin-top: 15px; background: #2a2a2a; padding: 10px 20px; border-radius: 6px; font-size: 14px; text-align: center; }
    .status-msg { color: #00ffcc; font-weight: bold; }
  </style>
</head>
<body>

  <div id="controls">
    <label for="level-select">Cargar Nivel:</label>
    <select id="level-select" onchange="loadSelectedLevel()">
      <option value="Nivel01_final">Nivel01_final</option>
      <option value="Nivel02_final">Nivel02_final</option>
      <option value="Nivel03_prueba">Nivel03_prueba</option>
      <option value="Nivel04_prueba">Nivel04_prueba</option>
      <option value="Nivel03_final" selected>Nivel03_final</option>
    </select>
    <button onclick="resetLevel()">Reiniciar Nivel</button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div id="info-panel">
    Controles: <strong>Flechas / WASD</strong> para moverte. | Duración del Tick: <strong>0.25s</strong>
    <div id="status" class="status-msg">¡Listo para jugar!</div>
  </div>

  <script>
    // --- NIVELES ---
    const LEVELS = {

          { "id": "s1", "type": "box_stone", "position": { "x": 0, "y": 1, "z": 0 }, "is_pushable": false },

          { "id": "s7", "type": "box_stone", "position": { "x": 1, "y": 1, "z": 2 }, "is_pushable": false },

          { "id": "s16", "type": "box_stone", "position": { "x": 3, "y": 1, "z": 2 }, "is_pushable": false },

        "triggers": [{ "id": "trig_3", "type": "pressure_plate", "position": { "x": 2, "z": 2 }, "target_gate_id": "gate_3" }],

      },

          { "id": "s3", "type": "box_stone", "position": { "x": 2, "y": 1, "z": 3 }, "is_pushable": false },

          { "id": "s6", "type": "box_stone", "position": { "x": 5, "y": 1, "z": 3 }, "is_pushable": false },
          { "id": "s7", "type": "box_stone", "position": { "x": 3, "y": 1, "z": 0 }, "is_pushable": false },
          { "id": "s8", "type": "box_stone", "position": { "x": 4, "y": 1, "z": 0 }, "is_pushable": false },
          { "id": "s9", "type": "box_stone", "position": { "x": 5, "y": 1, "z": 0 }, "is_pushable": false },
          { "id": "s10", "type": "box_stone", "position": { "x": 3, "y": 1, "z": 2 }, "is_pushable": false },
          { "id": "w1", "type": "box_wood", "position": { "x": 1, "y": 1, "z": 1 }, "is_pushable": true }
        ],
        "triggers": [{ "id": "trig_4", "type": "pressure_plate", "position": { "x": 2, "z": 2 }, "target_gate_id": "gate_4" }],
        "gates": [{ "id": "gate_4", "type": "gate", "position": { "x": 4, "z": 1 }, "is_open": false }],
        "goals": [{ "id": "goal_4", "type": "exit_portal", "position": { "x": 5, "z": 1 } }]
      },

      "Nivel03_final": {
        "dimensions": { "width": 6, "depth": 5, "height": 3 },
        "player_start": { "x": 1, "y": 1, "z": 1 },
        "entities": [
          { "id": "s1", "type": "box_stone", "position": { "x": 0, "y": 1, "z": 0 }, "is_pushable": false },
          { "id": "s2", "type": "box_stone", "position": { "x": 1, "y": 1, "z": 0 }, "is_pushable": false },
          { "id": "s3", "type": "box_stone", "position": { "x": 2, "y": 1, "z": 0 }, "is_pushable": false },
          { "id": "s4", "type": "box_stone", "position": { "x": 3, "y": 1, "z": 0 }, "is_pushable": false },

          { "id": "s11", "type": "box_stone", "position": { "x": 4, "y": 1, "z": 4 }, "is_pushable": false },
          { "id": "s12", "type": "box_stone", "position": { "x": 5, "y": 1, "z": 4 }, "is_pushable": false },
          { "id": "s13", "type": "box_stone", "position": { "x": 3, "y": 1, "z": 2 }, "is_pushable": false },
          { "id": "s14", "type": "box_stone", "position": { "x": 3, "y": 1, "z": 3 }, "is_pushable": false },
          { "id": "w1", "type": "box_wood", "position": { "x": 1, "y": 1, "z": 2 }, "is_pushable": true },

          { "id": "lava1", "type": "lava", "position": { "x": 2, "y": 1, "z": 1 } },
          { "id": "elev1", "type": "elevator", "position": { "x": 4, "y": 1, "z": 2 }, "current_y": 1 },
          { "id": "cannon1", "type": "cannon", "position": { "x": 0, "y": 1, "z": 1 }, "direction": "EAST" }
        ],
        "triggers": [
          { "id": "btn_elev_up", "type": "pressure_plate", "position": { "x": 2, "z": 3 }, "target_elevator_id": "elev1", "elevation_delta": 1 },
          { "id": "btn_elev_down", "type": "pressure_plate", "position": { "x": 1, "z": 3 }, "target_elevator_id": "elev1", "elevation_delta": -1 }
        ],
        "gates": [{ "id": "gate_5", "type": "gate", "position": { "x": 4, "z": 1 }, "is_open": false }],
        "goals": [{ "id": "goal_5", "type": "exit_portal", "position": { "x": 4, "z": 3 } }]
      }
    };

    // --- VARIABLES DE MOTOR ---
    const TICK_DURATION = 250; // 0.25 segundos
    let currentLevelData = null;
    let player = { x: 0, y: 1, z: 0 };
    let entities = [];
    let triggers = [];
    let gates = [];
    let goals = [];
    let activeProjectile = null; // { x, y, z, dirX, dirZ }
    let isMoving = false;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const TILE_SIZE = 60;

    function loadSelectedLevel() {
      const selectedName = document.getElementById('level-select').value;
      currentLevelData = JSON.parse(JSON.stringify(LEVELS[selectedName]));
      resetLevel();
    }

    function resetLevel() {
      player = { ...currentLevelData.player_start };
      entities = JSON.parse(JSON.stringify(currentLevelData.entities || []));
      triggers = JSON.parse(JSON.stringify(currentLevelData.triggers || []));
      gates = JSON.parse(JSON.stringify(currentLevelData.gates || []));
      goals = JSON.parse(JSON.stringify(currentLevelData.goals || []));
      activeProjectile = null;
      isMoving = false;
      updateGates();
      statusDiv.textContent = "Nivel listo.";
      draw();
    }

    // --- LOGICA DE COMPORTAMIENTO ---
    function handleKeyDown(e) {
      if (isMoving) return;

      let dx = 0, dz = 0;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dz = -1;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dz = 1;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dx = -1;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dx = 1;

      if (dx !== 0 || dz !== 0) {
        attemptMove(dx, dz);
      }
    }

    function attemptMove(dx, dz) {
      const targetX = player.x + dx;
      const targetZ = player.z + dz;

      // Colisión con límites del mapa
      if (targetX < 0 || targetX >= currentLevelData.dimensions.width ||
          targetZ < 0 || targetZ >= currentLevelData.dimensions.depth) return;

      // Pared de piedra
      const stone = entities.find(e => e.type === 'box_stone' && e.position.x === targetX && e.position.z === targetZ && e.position.y === player.y);
      if (stone) return;

      // Puerta cerrada
      const gate = gates.find(g => g.position.x === targetX && g.position.z === targetZ && !g.is_open);
      if (gate) return;

      // Caja de madera empujable
      const woodBox = entities.find(e => e.type === 'box_wood' && e.position.x === targetX && e.position.z === targetZ && e.position.y === player.y);
      if (woodBox) {
        const boxTargetX = targetX + dx;
        const boxTargetZ = targetZ + dz;
        const boxBlocker = entities.find(e => e.position.x === boxTargetX && e.position.z === boxTargetZ && e.position.y === player.y);
        const boxGate = gates.find(g => g.position.x === boxTargetX && g.position.z === boxTargetZ && !g.is_open);
        
        if (boxTargetX < 0 || boxTargetX >= currentLevelData.dimensions.width ||
            boxTargetZ < 0 || boxTargetZ >= currentLevelData.dimensions.depth || boxBlocker || boxGate) {
          return; // No se puede empujar la caja
        }
        woodBox.position.x = boxTargetX;
        woodBox.position.z = boxTargetZ;
      }

      // El jugador inicia movimiento (dura 1 tick)
      isMoving = true;
      player.x = targetX;
      player.z = targetZ;

      // Procesar proyectil en el mismo tick
      tickProjectile();

      // Evaluar estado tras completarse el tick (250ms)
      setTimeout(() => {
        isMoving = false;
        checkTriggers();
        checkHazardsAndVictory();
        draw();
      }, TICK_DURATION);

      draw();
    }

    function tickProjectile() {
      // Si hay un cañón y no hay proyectil activo, se dispara uno
      const cannon = entities.find(e => e.type === 'cannon');
      if (cannon && !activeProjectile) {
        let dirX = 0, dirZ = 0;
        if (cannon.direction === 'EAST') dirX = 1;
        if (cannon.direction === 'WEST') dirX = -1;
        if (cannon.direction === 'SOUTH') dirZ = 1;
        if (cannon.direction === 'NORTH') dirZ = -1;

        activeProjectile = {
          x: cannon.position.x + dirX,
          y: cannon.position.y,
          z: cannon.position.z + dirZ,
          dirX, dirZ
        };
      } else if (activeProjectile) {
        // Mover proyectil existente 1 casilla por tick
        activeProjectile.x += activeProjectile.dirX;
        activeProjectile.z += activeProjectile.dirZ;

        // Si choca con pared o sale del mapa, se destruye
        const hitStone = entities.find(e => e.type === 'box_stone' && e.position.x === activeProjectile.x && e.position.z === activeProjectile.z);
        if (activeProjectile.x < 0 || activeProjectile.x >= currentLevelData.dimensions.width ||
            activeProjectile.z < 0 || activeProjectile.z >= currentLevelData.dimensions.depth || hitStone) {
          activeProjectile = null;
        }
      }
    }

    function checkTriggers() {
      triggers.forEach(trig => {
        const isPlayerOn = (player.x === trig.position.x && player.z === trig.position.z);
        const isBoxOn = entities.some(e => e.type === 'box_wood' && e.position.x === trig.position.x && e.position.z === trig.position.z);
        
        if (isPlayerOn || isBoxOn) {
          if (trig.target_gate_id) {
            const gate = gates.find(g => g.id === trig.target_gate_id);
            if (gate) gate.is_open = true;
          }
          if (trig.target_elevator_id && trig.elevation_delta) {
            const elev = entities.find(e => e.id === trig.target_elevator_id);
            if (elev) elev.position.y += trig.elevation_delta;
          }
        }
      });
    }

    function updateGates() {
      gates.forEach(g => g.is_open = false);
      checkTriggers();
    }

    function checkHazardsAndVictory() {
      // 1. Proyectil impacta al jugador
      if (activeProjectile && activeProjectile.x === player.x && activeProjectile.z === player.z && activeProjectile.y === player.y) {
        statusDiv.textContent = "¡Te ha impactado un proyectil! Reiniciando...";
        setTimeout(resetLevel, 500);
        return;
      }

      // 2. Trampa Lava
      const lava = entities.find(e => e.type === 'lava' && e.position.x === player.x && e.position.z === player.z && e.position.y === player.y);
      if (lava) {
        statusDiv.textContent = "¡Caíste en lava! Reiniciando...";
        setTimeout(resetLevel, 500);
        return;
      }

      // 3. Trampa Hoyo (Solo en el piso inferior)
      const pit = entities.find(e => e.type === 'pit' && e.position.x === player.x && e.position.z === player.z);
      if (pit && player.y === 1) {
        statusDiv.textContent = "¡Caíste por el hoyo! Reiniciando...";
        setTimeout(resetLevel, 500);
        return;
      }

      // 4. Victoria
      const goal = goals.find(g => g.position.x === player.x && g.position.z === player.z);
      if (goal) {
        statusDiv.textContent = "¡Nivel Completado!";
      }
    }

    // --- RENDERIZADO VISUAL ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!currentLevelData) return;

      const offsetX = (canvas.width - currentLevelData.dimensions.width * TILE_SIZE) / 2;
      const offsetY = (canvas.height - currentLevelData.dimensions.depth * TILE_SIZE) / 2;

      // Dibujar cuadrícula
      for (let x = 0; x < currentLevelData.dimensions.width; x++) {
        for (let z = 0; z < currentLevelData.dimensions.depth; z++) {
          ctx.strokeStyle = '#333';
          ctx.strokeRect(offsetX + x * TILE_SIZE, offsetY + z * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }

      // Entidades
      entities.forEach(e => {
        const px = offsetX + e.position.x * TILE_SIZE;
        const pz = offsetY + e.position.z * TILE_SIZE;

        if (e.type === 'box_stone') {
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(px + 4, pz + 4, TILE_SIZE - 8, TILE_SIZE - 8);
        } else if (e.type === 'box_wood') {
          ctx.fillStyle = '#d35400';
          ctx.fillRect(px + 6, pz + 6, TILE_SIZE - 12, TILE_SIZE - 12);
        } else if (e.type === 'pit') {
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(px + TILE_SIZE/2, pz + TILE_SIZE/2, TILE_SIZE/3, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.type === 'lava') {
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(px + 8, pz + 8, TILE_SIZE - 16, TILE_SIZE - 16);
        } else if (e.type === 'elevator') {
          ctx.fillStyle = '#9b59b6';
          ctx.fillRect(px + 2, pz + 2, TILE_SIZE - 4, TILE_SIZE - 4);
          ctx.fillStyle = '#fff';
          ctx.fillText(`Piso:${e.position.y}`, px + 10, pz + TILE_SIZE / 2);
        } else if (e.type === 'cannon') {
          ctx.fillStyle = '#2c3e50';
          ctx.fillRect(px + 10, pz + 10, TILE_SIZE - 20, TILE_SIZE - 20);
        }
      });

      // Botones / Triggers
      triggers.forEach(t => {
        const px = offsetX + t.position.x * TILE_SIZE;
        const pz = offsetY + t.position.z * TILE_SIZE;
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, pz + TILE_SIZE/2, 10, 0, Math.PI * 2);
        ctx.fill();
      });

      // Portales / Metas
      goals.forEach(g => {
        const px = offsetX + g.position.x * TILE_SIZE;
        const pz = offsetY + g.position.z * TILE_SIZE;
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(px + 12, pz + 12, TILE_SIZE - 24, TILE_SIZE - 24);
      });

      // Proyectil
      if (activeProjectile) {
        const px = offsetX + activeProjectile.x * TILE_SIZE;
        const pz = offsetY + activeProjectile.z * TILE_SIZE;
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, pz + TILE_SIZE/2, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Jugador
      const playerPx = offsetX + player.x * TILE_SIZE;
      const playerPz = offsetY + player.z * TILE_SIZE;
      ctx.fillStyle = '#3498db';
      ctx.beginPath();
      ctx.arc(playerPx + TILE_SIZE/2, playerPz + TILE_SIZE/2, TILE_SIZE/3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Inicialización de eventos
    window.addEventListener('keydown', handleKeyDown);
    window.onload = loadSelectedLevel;
  </script>
</body>
</html>
