<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Editor y Engine de Niveles</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      margin: 0;
    }
    .mode-switch { margin-bottom: 10px; display: flex; gap: 10px; }
    .mode-btn { padding: 8px 16px; font-weight: bold; border-radius: 6px; border: none; background: #333; color: #fff; }
    .mode-btn.active { background: #2196F3; }
    
    #palette {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      max-width: 100vw;
      padding: 4px;
    }
    .tool {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 4px;
      border: 2px solid transparent;
      background: #222;
      color: #fff;
      white-space: nowrap;
    }
    .tool.selected { border-color: #FFF; font-weight: bold; }

    #game-board {
      display: grid;
      grid-template-columns: repeat(8, 40px);
      grid-template-rows: repeat(8, 40px);
      gap: 2px;
      background-color: #333;
      padding: 5px;
      border-radius: 8px;
    }
    .tile {
      width: 40px;
      height: 40px;
      background-color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      border-radius: 4px;
      user-select: none;
    }
    .player { background-color: #4CAF50; color: #fff; }
    .box_wood { background-color: #8B4513; color: #fff; }
    .box_ice { background-color: #00BCD4; color: #fff; }
    .box_elevator { background-color: #FFC107; color: #000; }
    .box_stone { background-color: #757575; color: #fff; }
    .pressure_plate { background-color: #9C27B0; color: #fff; }
    .exit_portal { background-color: #E91E63; color: #fff; }
    
    .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(3, 50px); gap: 8px; }
    .ctrl-btn { width: 50px; height: 50px; font-size: 18px; border: none; border-radius: 6px; background: #333; color: #fff; }
    #json-output { width: 100%; max-width: 340px; height: 80px; margin-top: 10px; background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 10px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="mode-switch">
    <button id="btn-edit-mode" class="mode-btn active" onclick="setMode('edit')">Modo Editor</button>
    <button id="btn-play-mode" class="mode-btn" onclick="setMode('play')">Modo Jugar</button>
  </div>

  <!-- PALETA DE HERRAMIENTAS DEL EDITOR -->
  <div id="palette">
    <button class="tool selected" onclick="selectTool('player', this)">Jugador</button>
    <button class="tool" onclick="selectTool('box_wood', this)">Madera</button>
    <button class="tool" onclick="selectTool('box_ice', this)">Hielo</button>
    <button class="tool" onclick="selectTool('box_stone', this)">Piedra</button>
    <button class="tool" onclick="selectTool('box_elevator', this)">Elevador</button>
    <button class="tool" onclick="selectTool('pressure_plate', this)">Boton</button>
    <button class="tool" onclick="selectTool('exit_portal', this)">Meta</button>
    <button class="tool" onclick="selectTool('erase', this)">Borrar</button>
  </div>

  <div id="game-board"></div>

  <!-- CONTROLES DE JUEGO -->
  <div id="play-controls" class="controls" style="display:none;">
    <div></div>
    <button class="ctrl-btn" onclick="gameEngine.move('UP')">▲</button>
    <div></div>
    <button class="ctrl-btn" onclick="gameEngine.move('LEFT')">◄</button>
    <button class="ctrl-btn" onclick="gameEngine.move('DOWN')">▼</button>
    <button class="ctrl-btn" onclick="gameEngine.move('RIGHT')">►</button>
  </div>

  <textarea id="json-output" readonly placeholder="JSON del nivel generado..."></textarea>

  <script>
    let currentMode = 'edit';
    let selectedTool = 'player';
    const gridDim = { width: 8, depth: 8 };

    // ESTADO DEL NIVEL (Estructura JSON)
    let levelData = {
      dimensions: gridDim,
      player_start: { x: 1, z: 1 },
      entities: [],
      triggers: [],
      goals: []
    };

    function selectTool(tool, element) {
      selectedTool = tool;
      document.querySelectorAll('.tool').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-edit-mode').classList.toggle('active', mode === 'edit');
      document.getElementById('btn-play-mode').classList.toggle('active', mode === 'play');
      document.getElementById('palette').style.display = mode === 'edit' ? 'flex' : 'none';
      document.getElementById('play-controls').style.display = mode === 'play' ? 'grid' : 'none';
      
      if (mode === 'play') {
        gameEngine.init(JSON.parse(JSON.stringify(levelData)));
      } else {
        renderEditor();
      }
    }

    // LÓGICA DE EDICIÓN AL HACER CLIC EN EL GRID
    function handleTileClick(x, z) {
      if (currentMode !== 'edit') return;

      // Limpiar entidad previa en esa coordenada
      levelData.entities = levelData.entities.filter(e => !(e.position.x === x && e.position.z === z));
      levelData.triggers = levelData.triggers.filter(t => !(t.position.x === x && t.position.z === z));
      levelData.goals = levelData.goals.filter(g => !(g.position.x === x && g.position.z === z));

      if (selectedTool === 'player') {
        levelData.player_start = { x, z };
      } else if (selectedTool === 'pressure_plate') {
        levelData.triggers.push({ id: `trig_${x}_${z}`, type: 'pressure_plate', position: { x, z } });
      } else if (selectedTool === 'exit_portal') {
        levelData.goals.push({ id: `goal_${x}_${z}`, type: 'exit_portal', position: { x, z }, requires_all_triggers: true });
      } else if (selectedTool !== 'erase') {
        const isPushable = selectedTool === 'box_wood' || selectedTool === 'box_ice';
        levelData.entities.push({
          id: `ent_${x}_${z}`,
          type: selectedTool,
          position: { x, z },
          is_pushable: isPushable
        });
      }

      renderEditor();
    }

    function renderEditor() {
      const board = document.getElementById('game-board');
      board.innerHTML = '';

      for (let z = 0; z < gridDim.depth; z++) {
        for (let x = 0; x < gridDim.width; x++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.onclick = () => handleTileClick(x, z);

          if (levelData.player_start.x === x && levelData.player_start.z === z) {
            tile.classList.add('player');
            tile.innerText = 'P1';
          }

          const trig = levelData.triggers.find(t => t.position.x === x && t.position.z === z);
          if (trig) { tile.classList.add('pressure_plate'); tile.innerText = 'Btn'; }

          const goal = levelData.goals.find(g => g.position.x === x && g.position.z === z);
          if (goal) { tile.classList.add('exit_portal'); tile.innerText = 'Meta'; }

          const ent = levelData.entities.find(e => e.position.x === x && e.position.z === z);
          if (ent) {
            tile.classList.add(ent.type);
            const labels = { box_wood: 'Madera', box_ice: 'Hielo', box_stone: 'Piedra', box_elevator: 'Elev' };
            tile.innerText = labels[ent.type] || '';
          }

          board.appendChild(tile);
        }
      }
      document.getElementById('json-output').value = JSON.stringify(levelData, null, 2);
    }

    // MOTOR DE JUEGO
    const gameEngine = {
      data: null,
      pos: { x: 0, z: 0 },
      init(data) {
        this.data = data;
        this.pos = { ...data.player_start };
        this.render();
      },
      move(dir) {
        const d = { UP: { x: 0, z: -1 }, DOWN: { x: 0, z: 1 }, LEFT: { x: -1, z: 0 }, RIGHT: { x: 1, z: 0 } }[dir];
        const tx = this.pos.x + d.x, tz = this.pos.z + d.z;
        if (tx < 0 || tx >= gridDim.width || tz < 0 || tz >= gridDim.depth) return;

        const ent = this.data.entities.find(e => e.position.x === tx && e.position.z === tz);
        if (ent) {
          if (ent.type === 'box_elevator') { this.pos = { x: tx, z: tz }; }
          else if (ent.is_pushable && this.push(ent, d)) { this.pos = { x: tx, z: tz }; }
          this.render();
          return;
        }
        this.pos = { x: tx, z: tz };
        this.render();
      },
      push(ent, d) {
        let nx = ent.position.x + d.x, nz = ent.position.z + d.z;
        if (nx < 0 || nx >= gridDim.width || nz < 0 || nz >= gridDim.depth) return false;
        if (this.data.entities.some(e => e.position.x === nx && e.position.z === nz)) return false;

        if (ent.type === 'box_wood') {
          ent.position = { x: nx, z: nz };
          return true;
        }
        if (ent.type === 'box_ice') {
          let lx = ent.position.x, lz = ent.position.z;
          while (nx >= 0 && nx < gridDim.width && nz >= 0 && nz < gridDim.depth && !this.data.entities.some(e => e.position.x === nx && e.position.z === nz)) {
            lx = nx; lz = nz; nx += d.x; nz += d.z;
          }
          ent.position = { x: lx, z: lz };
          return true;
        }
        return false;
      },
      render() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';
        
        let allTriggersPressed = true;
        this.data.triggers.forEach(t => {
          const pressed = (this.pos.x === t.position.x && this.pos.z === t.position.z) || this.data.entities.some(e => e.position.x === t.position.x && e.position.z === t.position.z);
          if (!pressed) allTriggersPressed = false;
        });

        for (let z = 0; z < gridDim.depth; z++) {
          for (let x = 0; x < gridDim.width; x++) {
            const tile = document.createElement('div');
            tile.className = 'tile';

            const trig = this.data.triggers.find(t => t.position.x === x && t.position.z === z);
            if (trig) tile.classList.add('pressure_plate');

            const goal = this.data.goals.find(g => g.position.x === x && g.position.z === z);
            if (goal && allTriggersPressed) tile.classList.add('exit_portal');

            const ent = this.data.entities.find(e => e.position.x === x && e.position.z === z);
            if (ent) {
              tile.classList.add(ent.type);
              const labels = { box_wood: 'Madera', box_ice: 'Hielo', box_stone: 'Piedra', box_elevator: 'Elev' };
              tile.innerText = labels[ent.type] || '';
            }

            if (this.pos.x === x && this.pos.z === z) {
              tile.className = 'tile player';
              tile.innerText = 'P1';
            }

            board.appendChild(tile);
          }
        }
      }
    };

    renderEditor();
  </script>
</body>
</html>
