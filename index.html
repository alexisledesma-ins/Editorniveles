<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Editor Completo de Niveles</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      margin: 0;
    }
    .mode-switch { margin-bottom: 8px; display: flex; gap: 10px; }
    .mode-btn { padding: 8px 16px; font-weight: bold; border-radius: 6px; border: none; background: #333; color: #fff; }
    .mode-btn.active { background: #2196F3; }

    /* CONTROLES DE CONFIGURACIÓN, ARCHIVOS Y PISO */
    .config-panel {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .config-panel label { display: flex; align-items: center; gap: 4px; }
    .config-panel input[type="number"] { width: 45px; background: #333; border: 1px solid #555; color: #fff; padding: 4px; border-radius: 4px; text-align: center; }
    .action-btn { background: #2196F3; border: none; color: #fff; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .save-btn { background: #4CAF50; }
    .load-btn { background: #FF9800; }

    #palette {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto;
      max-width: 100vw;
      padding: 4px;
    }
    .tool {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 4px;
      border: 2px solid transparent;
      background: #222;
      color: #fff;
      white-space: nowrap;
    }
    .tool.selected { border-color: #FFF; font-weight: bold; }

    #game-container { overflow: auto; max-width: 100vw; padding: 5px; }
    #game-board {
      display: grid;
      gap: 2px;
      background-color: #333;
      padding: 5px;
      border-radius: 8px;
    }
    .tile {
      width: 40px;
      height: 40px;
      background-color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      border-radius: 4px;
      user-select: none;
      position: relative;
    }
    .tile[data-height="2"] { border: 2px solid #FFC107; background-color: #2a2510; }
    .tile[data-height="3"] { border: 2px solid #FF9800; background-color: #33200a; }

    .player { background-color: #4CAF50 !important; color: #fff; }
    .box_wood { background-color: #8B4513 !important; color: #fff; }
    .box_ice { background-color: #00BCD4 !important; color: #fff; }
    .box_elevator { background-color: #FFC107 !important; color: #000; }
    .box_stone { background-color: #757575 !important; color: #fff; }
    .pressure_plate { background-color: #9C27B0 !important; color: #fff; }
    .gate { background-color: #FF5722 !important; color: #fff; }
    .exit_portal { background-color: #E91E63 !important; color: #fff; }

    .link-badge { font-size: 8px; background: rgba(0,0,0,0.6); padding: 1px 3px; border-radius: 3px; margin-top: 2px; }

    .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(3, 50px); gap: 8px; }
    .ctrl-btn { width: 50px; height: 50px; font-size: 18px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }
    .reset-btn { background: #f44336; font-weight: bold; }
    #json-output { width: 100%; max-width: 360px; height: 90px; margin-top: 10px; background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 10px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="mode-switch">
    <button id="btn-edit-mode" class="mode-btn active" onclick="setMode('edit')">Modo Editor</button>
    <button id="btn-play-mode" class="mode-btn" onclick="setMode('play')">Modo Jugar</button>
  </div>

  <!-- PANEL DE TAMAÑO, GUARDADO Y PISO -->
  <div class="config-panel" id="config-panel">
    <label>Ancho: <input type="number" id="inp-w" value="8" min="3" max="15"></label>
    <label>Alto: <input type="number" id="inp-h" value="8" min="3" max="15"></label>
    <button class="action-btn" onclick="updateDimensions()">Redimensionar</button>
    
    <span style="border-left: 1px solid #555; padding-left: 8px;"></span>
    <label>Piso Y: <input type="number" id="inp-y" value="1" min="1" max="3" onchange="currentLayer = parseInt(this.value); renderEditor();"></label>
    
    <span style="border-left: 1px solid #555; padding-left: 8px;"></span>
    <button class="action-btn save-btn" onclick="downloadLevelJSON()">Descargar JSON</button>
    <button class="action-btn load-btn" onclick="document.getElementById('file-input').click()">Cargar JSON</button>
    <input type="file" id="file-input" accept=".json" style="display:none;" onchange="loadLevelJSON(event)">
  </div>

  <!-- PALETA DE HERRAMIENTAS -->
  <div id="palette">
    <button class="tool selected" onclick="selectTool('player', this)">Jugador</button>
    <button class="tool" onclick="selectTool('box_wood', this)">Madera</button>
    <button class="tool" onclick="selectTool('box_ice', this)">Hielo</button>
    <button class="tool" onclick="selectTool('box_stone', this)">Piedra</button>
    <button class="tool" onclick="selectTool('box_elevator', this)">Elevador (Y+1)</button>
    <button class="tool" onclick="selectTool('pressure_plate', this)">Botón (Switch)</button>
    <button class="tool" onclick="selectTool('gate', this)">Puerta (Gate)</button>
    <button class="tool" onclick="selectTool('exit_portal', this)">Meta</button>
    <button class="tool" onclick="selectTool('linker', this)">Enlazar (Link)</button>
    <button class="tool" onclick="selectTool('erase', this)">Borrar</button>
  </div>

  <div id="game-container">
    <div id="game-board"></div>
  </div>

  <!-- CONTROLES MÓVILES -->
  <div id="play-controls" class="controls" style="display:none;">
    <button class="ctrl-btn reset-btn" onclick="gameEngine.restart()" title="Reiniciar nivel">↺</button>
    <button class="ctrl-btn" onclick="gameEngine.move('UP')">▲</button>
    <div></div>
    <button class="ctrl-btn" onclick="gameEngine.move('LEFT')">◄</button>
    <button class="ctrl-btn" onclick="gameEngine.move('DOWN')">▼</button>
    <button class="ctrl-btn" onclick="gameEngine.move('RIGHT')">►</button>
  </div>

  <textarea id="json-output" readonly placeholder="JSON del nivel..."></textarea>

  <script>
    let currentMode = 'edit';
    let selectedTool = 'player';
    let currentLayer = 1;
    let linkingSource = null;
    let nextLinkId = 1;

    let levelData = {
      dimensions: { width: 8, depth: 8, height: 3 },
      player_start: { x: 1, y: 1, z: 1 },
      entities: [],
      triggers: [],
      gates: [],
      goals: []
    };

    // FUNCIONES DE GUARDADO Y CARGA DE NIVELES
    function downloadLevelJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(levelData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "nivel_puzzle.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function loadLevelJSON(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const loadedData = JSON.parse(e.target.result);
          levelData = loadedData;
          document.getElementById('inp-w').value = levelData.dimensions.width;
          document.getElementById('inp-h').value = levelData.dimensions.depth;
          currentLayer = 1;
          document.getElementById('inp-y').value = 1;
          renderEditor();
          alert("¡Nivel cargado con éxito!");
        } catch (err) {
          alert("Error al leer el archivo JSON.");
        }
      };
      fileReader.readAsText(event.target.files[0]);
    }

    function updateDimensions() {
      const w = parseInt(document.getElementById('inp-w').value) || 8;
      const h = parseInt(document.getElementById('inp-h').value) || 8;
      levelData.dimensions.width = w;
      levelData.dimensions.depth = h;
      renderEditor();
    }

    function selectTool(tool, element) {
      selectedTool = tool;
      linkingSource = null;
      document.querySelectorAll('.tool').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-edit-mode').classList.toggle('active', mode === 'edit');
      document.getElementById('btn-play-mode').classList.toggle('active', mode === 'play');
      document.getElementById('palette').style.display = mode === 'edit' ? 'flex' : 'none';
      document.getElementById('config-panel').style.display = mode === 'edit' ? 'flex' : 'none';
      document.getElementById('play-controls').style.display = mode === 'play' ? 'grid' : 'none';

      if (mode === 'play') {
        gameEngine.init(levelData);
      } else {
        renderEditor();
      }
    }

    function handleTileClick(x, z) {
      if (currentMode !== 'edit') return;
      const y = currentLayer;

      if (selectedTool === 'linker') {
        const trig = levelData.triggers.find(t => t.position.x === x && t.position.z === z);
        const gate = levelData.gates.find(g => g.position.x === x && g.position.z === z);

        if (trig) {
          linkingSource = trig;
          alert(`Botón seleccionado. Ahora toca la Puerta que deseas enlazar.`);
        } else if (gate && linkingSource) {
          const linkTag = `link_${nextLinkId++}`;
          linkingSource.target_gate_id = linkTag;
          gate.id = linkTag;
          alert(`¡Enlace creado correctamente! (${linkTag})`);
          linkingSource = null;
          renderEditor();
        }
        return;
      }

      levelData.entities = levelData.entities.filter(e => !(e.position.x === x && e.position.z === z && (e.position.y || 1) === y));
      levelData.triggers = levelData.triggers.filter(t => !(t.position.x === x && t.position.z === z));
      levelData.gates = levelData.gates.filter(g => !(g.position.x === x && g.position.z === z));
      levelData.goals = levelData.goals.filter(g => !(g.position.x === x && g.position.z === z));

      if (selectedTool === 'player') {
        levelData.player_start = { x, y, z };
      } else if (selectedTool === 'pressure_plate') {
        levelData.triggers.push({ id: `trig_${x}_${z}`, type: 'pressure_plate', position: { x, z }, target_gate_id: null });
      } else if (selectedTool === 'gate') {
        levelData.gates.push({ id: `gate_${x}_${z}`, type: 'gate', position: { x, z }, is_open: false });
      } else if (selectedTool !== 'erase') {
        const isPushable = selectedTool === 'box_wood' || selectedTool === 'box_ice';
        levelData.entities.push({
          id: `ent_${x}_${z}_${y}`,
          type: selectedTool,
          position: { x, y, z },
          is_pushable: isPushable
        });
      }

      renderEditor();
    }

    function renderEditor() {
      const board = document.getElementById('game-board');
      board.style.gridTemplateColumns = `repeat(${levelData.dimensions.width}, 40px)`;
      board.innerHTML = '';

      for (let z = 0; z < levelData.dimensions.depth; z++) {
        for (let x = 0; x < levelData.dimensions.width; x++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.onclick = () => handleTileClick(x, z);

          const trig = levelData.triggers.find(t => t.position.x === x && t.position.z === z);
          if (trig) {
            tile.classList.add('pressure_plate');
            tile.innerText = 'Btn';
            if (trig.target_gate_id) tile.innerHTML += `<span class="link-badge">${trig.target_gate_id}</span>`;
          }

          const gate = levelData.gates.find(g => g.position.x === x && g.position.z === z);
          if (gate) {
            tile.classList.add('gate');
            tile.innerText = 'Puerta';
            if (gate.id) tile.innerHTML += `<span class="link-badge">${gate.id}</span>`;
          }

          const goal = levelData.goals.find(g => g.position.x === x && g.position.z === z);
          if (goal) { tile.classList.add('exit_portal'); tile.innerText = 'Meta'; }

          const ent = levelData.entities.find(e => e.position.x === x && e.position.z === z && (e.position.y || 1) === currentLayer);
          if (ent) {
            tile.classList.add(ent.type);
            const labels = { box_wood: 'Madera', box_ice: 'Hielo', box_stone: 'Piedra', box_elevator: 'Elev' };
            tile.innerText = labels[ent.type] || '';
          }

          if (levelData.player_start.x === x && levelData.player_start.z === z && (levelData.player_start.y || 1) === currentLayer) {
            tile.className = 'tile player';
            tile.innerText = 'P1';
          }

          tile.setAttribute('data-height', currentLayer);
          board.appendChild(tile);
        }
      }
      document.getElementById('json-output').value = JSON.stringify(levelData, null, 2);
    }

    // MOTOR DE JUEGO
    const gameEngine = {
      rawLevelData: null,
      data: null,
      pos: { x: 0, y: 1, z: 0 },
      isCompleted: false,

      init(data) {
        this.rawLevelData = JSON.stringify(data);
        this.restart();
      },

      restart() {
        this.data = JSON.parse(this.rawLevelData);
        this.pos = { ...this.data.player_start };
        if (!this.pos.y) this.pos.y = 1;
        this.isCompleted = false;
        this.checkTriggers();
        this.render();
      },

      move(dir) {
        if (this.isCompleted) return;

        const d = { UP: { x: 0, z: -1 }, DOWN: { x: 0, z: 1 }, LEFT: { x: -1, z: 0 }, RIGHT: { x: 1, z: 0 } }[dir];
        const tx = this.pos.x + d.x, tz = this.pos.z + d.z;

        if (tx < 0 || tx >= this.data.dimensions.width || tz < 0 || tz >= this.data.dimensions.depth) return;

        const gate = this.data.gates.find(g => g.position.x === tx && g.position.z === tz);
        if (gate && !gate.is_open) return;

        const ent = this.data.entities.find(e => e.position.x === tx && e.position.z === tz && (e.position.y || 1) === this.pos.y);

        if (ent) {
          if (ent.type === 'box_elevator') {
            this.pos = { x: tx, y: this.pos.y + 1, z: tz };
          } else if (ent.is_pushable && this.push(ent, d)) {
            this.pos = { x: tx, y: this.pos.y, z: tz };
          }
          this.checkTriggers();
          this.checkWinCondition();
          this.render();
          return;
        }

        this.pos = { x: tx, y: this.pos.y, z: tz };
        this.checkTriggers();
        this.checkWinCondition();
        this.render();
      },

      push(ent, d) {
        let nx = ent.position.x + d.x, nz = ent.position.z + d.z;
        if (nx < 0 || nx >= this.data.dimensions.width || nz < 0 || nz >= this.data.dimensions.depth) return false;
        if (this.data.entities.some(e => e.position.x === nx && e.position.z === nz && (e.position.y || 1) === ent.position.y)) return false;

        if (ent.type === 'box_wood') {
          ent.position.x = nx; ent.position.z = nz;
          return true;
        }
        if (ent.type === 'box_ice') {
          let lx = ent.position.x, lz = ent.position.z;
          while (nx >= 0 && nx < this.data.dimensions.width && nz >= 0 && nz < this.data.dimensions.depth &&
                 !this.data.entities.some(e => e.position.x === nx && e.position.z === nz && (e.position.y || 1) === ent.position.y)) {
            lx = nx; lz = nz; nx += d.x; nz += d.z;
          }
          ent.position.x = lx; ent.position.z = lz;
          return true;
        }
        return false;
      },

      checkTriggers() {
        this.data.triggers.forEach(trig => {
          const pressed = (this.pos.x === trig.position.x && this.pos.z === trig.position.z) ||
                          this.data.entities.some(e => e.position.x === trig.position.x && e.position.z === trig.position.z);

          if (trig.target_gate_id) {
            const gate = this.data.gates.find(g => g.id === trig.target_gate_id);
            if (gate) gate.is_open = pressed;
          }
        });
      },

      checkWinCondition() {
        const goalReached = this.data.goals.some(g => g.position.x === this.pos.x && g.position.z === this.pos.z);
        if (goalReached && !this.isCompleted) {
          this.isCompleted = true;
          setTimeout(() => {
            alert("🎉 ¡NIVEL COMPLETADO! 🎉");
          }, 100);
        }
      },

      render() {
        const board = document.getElementById('game-board');
        board.style.gridTemplateColumns = `repeat(${this.data.dimensions.width}, 40px)`;
        board.innerHTML = '';

        for (let z = 0; z < this.data.dimensions.depth; z++) {
          for (let x = 0; x < this.data.dimensions.width; x++) {
            const tile = document.createElement('div');
            tile.className = 'tile';

            const trig = this.data.triggers.find(t => t.position.x === x && t.position.z === z);
            if (trig) tile.classList.add('pressure_plate');

            const gate = this.data.gates.find(g => g.position.x === x && g.position.z === z);
            if (gate && !gate.is_open) {
              tile.classList.add('gate');
              tile.innerText = 'Puerta';
            }

            const goal = this.data.goals.find(g => g.position.x === x && g.position.z === z);
            if (goal) tile.classList.add('exit_portal');

            const ent = this.data.entities.find(e => e.position.x === x && e.position.z === z && (e.position.y || 1) === this.pos.y);
            if (ent) {
              tile.classList.add(ent.type);
              const labels = { box_wood: 'Madera', box_ice: 'Hielo', box_stone: 'Piedra', box_elevator: 'Elev' };
              tile.innerText = labels[ent.type] || '';
            }

            if (this.pos.x === x && this.pos.z === z) {
              tile.className = 'tile player';
              tile.innerText = `P1 (Y:${this.pos.y})`;
            }

            tile.setAttribute('data-height', this.pos.y);
            board.appendChild(tile);
          }
        }
      }
    };

    renderEditor();
  </script>
</body>
</html>
